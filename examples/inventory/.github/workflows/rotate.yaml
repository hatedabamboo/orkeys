name: Rotate

on:
  schedule:
    - cron: "17 * * * *"                      # hourly: rotation steps and revoke checks span several runs
  workflow_dispatch:
    inputs:
      now:
        description: Comma-separated keys to rotate now
        default: ""
      retry:
        description: Comma-separated keys with a failed rotation to retry
        default: ""

permissions:
  contents: read

concurrency:
  group: orkeys-state                         # one state-changing run at a time
  cancel-in-progress: false

env:
  ORKEYS_VERSION: v0.4.0                      # release to install; it must have .sha256 files
  ORKEYS_EVENTS_FILE: events.jsonl            # gets each event at once; a killed run keeps them
  VAULT_ADDR: ${{ vars.VAULT_ADDR }}

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install orkeys # release binary, checked against its checksum
        run: |
          base="https://github.com/hatedabamboo/orkeys/releases/download/$ORKEYS_VERSION"
          curl -fsSLO "$base/orkeys-linux-amd64"
          curl -fsSLO "$base/orkeys-linux-amd64.sha256"
          sha256sum -c orkeys-linux-amd64.sha256
          sudo install -m 0755 orkeys-linux-amd64 /usr/local/bin/orkeys

      - name: Configure kubectl # one context per cluster in policy.yaml clusters
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p ~/.kube
          printf '%s' "$KUBECONFIG_DATA" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Rotate the keys
        env:
          VAULT_ROLE_ID: ${{ secrets.VAULT_ROLE_ID }} # AppRole with write access to state and secrets
          VAULT_SECRET_ID: ${{ secrets.VAULT_SECRET_ID }}
          NOW: ${{ inputs.now }}
          RETRY: ${{ inputs.retry }}
        run: |
          args=()
          if [ -n "$NOW" ]; then args+=(--now "$NOW"); fi
          if [ -n "$RETRY" ]; then args+=(--retry "$RETRY"); fi
          orkeys rotate "${args[@]}" --json > orkeys-output.json

      - name: Events # set ORKEYS_EVENTS_WEBHOOK to also post each event
        if: always()
        run: |
          {
            echo "| Level | Type | Key | Channel | Message |"
            echo "|---|---|---|---|---|"
            if [ -s events.jsonl ]; then
              jq -r '"| \(.level) | \(.type) | `\(.key)` | \(.channel // "") | \(.message) |"' events.jsonl
            fi
            if [ -s orkeys-output.json ]; then
              jq -r 'if .error then "\n**Error:** \(.error)" else empty end' orkeys-output.json
            fi
          } >> "$GITHUB_STEP_SUMMARY"
