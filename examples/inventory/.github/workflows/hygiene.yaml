name: Hygiene

on:
  schedule:
    - cron: "0 7 * * 1"                       # weekly
  workflow_dispatch:
    inputs:
      dry-run:
        description: Report only
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: orkeys-state
  cancel-in-progress: false

env:
  ORKEYS_VERSION: v0.4.0                      # release to install; it must have .sha256 files
  ORKEYS_EVENTS_FILE: events.jsonl            # gets each event at once; a killed run keeps them
  VAULT_ADDR: ${{ vars.VAULT_ADDR }}

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install orkeys # release binary, checked against its checksum
        run: |
          base="https://github.com/hatedabamboo/orkeys/releases/download/$ORKEYS_VERSION"
          curl -fsSLO "$base/orkeys-linux-amd64"
          curl -fsSLO "$base/orkeys-linux-amd64.sha256"
          sha256sum -c orkeys-linux-amd64.sha256
          sudo install -m 0755 orkeys-linux-amd64 /usr/local/bin/orkeys

      - name: Hygiene
        env:
          VAULT_ROLE_ID: ${{ secrets.VAULT_ROLE_ID }}
          VAULT_SECRET_ID: ${{ secrets.VAULT_SECRET_ID }}
          GITHUB_TOKEN: ${{ secrets.ORG_READ_TOKEN }}       # read:org; the default token cannot read org members
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
        run: |
          args=()
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          orkeys hygiene "${args[@]}" --json > orkeys-output.json

      - name: Findings
        if: always()
        run: |
          [ -s orkeys-output.json ] || exit 0
          {
            echo "### Findings"
            echo
            jq -r '.findings[] | "- [\(if .done then "x" else " " end)] \(.kind) `\(.name)`: \(.detail)"' orkeys-output.json
            jq -r 'if .error then "\n**Error:** \(.error)" else empty end' orkeys-output.json
          } >> "$GITHUB_STEP_SUMMARY"
